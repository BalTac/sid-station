name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Rust tests
        # Collection-dependent tests are skipped without HVSC_ROOT.
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npm run tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Copy-Item -Destination artifacts
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Copy-Item -Destination artifacts
          Get-ChildItem artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Tee-Object -FilePath artifacts/SHA256SUMS.txt -Append
          }
          Get-Content artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sid-station-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
