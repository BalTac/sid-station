[package]
name = "sid-station"
version = "0.1.0"
description = "Local HVSC browser and SID player"
authors = ["SID Station"]
license = "GPL-2.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "sid_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
walkdir = "2.5.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sevenz-rust = "0.6.1"
sha2 = "0.11.1"
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
encoding_rs = "0.8"
md-5 = "0.10"

# Keep debug builds usable with bundled SQLite and the WASM-free Rust backend.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
